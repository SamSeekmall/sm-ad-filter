<!doctype html><html lang="zh-CN" class="smPopup"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SM 净览</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="popup.css"></head><body class="popup">
<main>
<header>{{brand}}<strong>SM 净览</strong></header>
<section class="site"><h1 id="host">当前网站</h1><p id="state" role="status" aria-live="polite" data-kind="loading">正在读取保护状态…</p><p id="detail" class="caption" hidden></p></section>
<div class="primary"><button id="pause" disabled><span class="icon iconPause">{{player-pause}}</span><span class="icon iconPlay" hidden>{{player-play}}</span><span id="pauseLabel">暂停此站点</span></button><label class="duration"><span class="srOnly">暂停时长</span><select id="duration" aria-label="暂停时长"><option value="10m">10 分钟</option><option value="1h">1 小时</option><option value="session">到关闭浏览器</option></select>{{chevron-down}}</label></div>
<p id="actionStatus" role="status" aria-live="polite" hidden></p>
<section id="check" class="check" aria-live="polite" hidden><p id="checkText"></p><div id="checkActions" class="checkActions"></div></section>
<section class="tools"><details id="modeDetails"><summary>{{filter}}<span class="rowText"><strong>过滤模式</strong><span id="modeLabel">读取中</span></span>{{chevron-right}}</summary><div class="expanded"><label for="mode">此站点过滤模式</label><select id="mode" disabled><option value="0">不过滤</option><option value="1">轻度过滤</option><option value="2">标准过滤（推荐）</option><option value="3">强力过滤</option></select><p class="hint">轻度只拦截网络请求；标准同时隐藏广告位；强力隐藏范围更广，偶尔影响网页。</p><button id="apply" disabled>应用并刷新网站</button><p id="permission"></p><button id="stats" class="textButton" disabled>查看近期规则命中</button><p id="statsText" hidden></p></div></details>
<button id="zap" class="toolRow" type="button" disabled>{{click}}<span class="rowText"><strong>这次先隐藏</strong><span>点选网页上的元素，刷新后恢复</span></span>{{chevron-right}}</button>
<button id="pick" class="toolRow" type="button" disabled>{{eye-off}}<span class="rowText"><strong>以后都隐藏</strong><span>点选元素并保存为本站规则，可撤销</span></span>{{chevron-right}}</button>
<button id="unpick" class="toolRow" type="button" hidden>{{trash}}<span class="rowText"><strong>管理本站已隐藏的元素</strong><span>查看或删除已保存的隐藏规则</span></span>{{chevron-right}}</button></section>
<footer><a id="center" href="../welcome.html" target="_blank">{{adjustments-horizontal}}<span>控制中心</span></a><a id="feedback" href="../welcome.html#feedback" target="_blank">{{message}}<span>反馈问题</span></a></footer>
</main><template id="activeDot">{{circle-filled}}</template><template id="pausedDot">{{circle}}</template><script src="popup.js" defer></script></body></html>
