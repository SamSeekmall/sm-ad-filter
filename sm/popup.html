<!doctype html><html lang="zh-CN" class="smPopup"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SM 净览</title><link rel="stylesheet" href="popup.css"></head><body class="popup">
<main>
<header><img class="brand" src="brand.png" width="32" height="32" alt="" decoding="async"><strong>SM 净览</strong><a id="settings" class="iconButton" href="../welcome.html" target="_blank" aria-label="打开设置">{{settings}}</a></header>
<section class="site"><h1 id="host">当前网站</h1><p id="state" role="status" aria-live="polite" data-kind="loading">正在读取保护状态…</p><p class="caption">当前网站</p></section>
<div class="primary"><button id="pause" disabled>{{player-pause}}<span id="pauseLabel">暂停此站点</span></button><label class="duration"><span class="srOnly">暂停时长</span><select id="duration" aria-label="暂停时长"><option value="10m">10 分钟</option><option value="session">本次会话</option></select>{{chevron-down}}</label></div>
<p id="actionStatus" role="status" aria-live="polite" hidden></p>
<section class="tools"><details id="modeDetails"><summary>{{filter}}<span class="rowText"><strong>过滤模式</strong><span id="modeLabel">读取中</span></span>{{chevron-right}}</summary><div class="expanded"><label for="mode">此站点过滤模式</label><select id="mode" disabled><option value="0">不过滤</option><option value="1">基础过滤</option><option value="2">优化过滤</option><option value="3">完整过滤</option></select><button id="apply" disabled>应用并刷新网站</button><p id="permission"></p><button id="stats" class="textButton" disabled>查看近期规则命中</button><p id="statsText" hidden></p></div></details>
<a id="elements" class="toolRow" href="../popup.html">{{select}}<strong>元素工具</strong>{{chevron-right}}</a></section>
<footer><a id="center" href="../welcome.html" target="_blank">{{adjustments-horizontal}}<span>控制中心</span></a><a id="feedback" href="../welcome.html#feedback" target="_blank">{{message}}<span>反馈问题</span></a></footer>
</main><template id="activeDot">{{circle-filled}}</template><script src="popup.js" defer></script></body></html>
