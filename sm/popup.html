<!doctype html><html lang="zh-CN" class="smPopup"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SM 净览</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="popup.css"></head><body class="popup">
<main>
<header>{{brand}}<strong>SM 净览</strong><span id="host" class="host">当前网站</span></header>
<section class="status"><span id="stateIcon" class="stateIcon" aria-hidden="true"></span><div class="statusText"><p id="state" role="status" aria-live="polite" data-kind="loading">正在读取保护状态…</p><p id="detail" class="caption" hidden></p></div></section>
<div id="mode" class="seg" role="radiogroup" aria-label="此站点过滤模式"><button type="button" role="radio" data-level="0" aria-checked="false" disabled>不过滤</button><button type="button" role="radio" data-level="1" aria-checked="false" disabled>轻度</button><button type="button" role="radio" data-level="2" aria-checked="false" disabled>标准</button><button type="button" role="radio" data-level="3" aria-checked="false" disabled>强力</button></div>
<p id="modeHint" class="hint">&nbsp;</p>
<div class="primary"><button id="pause" disabled><span class="icon iconPause">{{player-pause}}</span><span class="icon iconPlay" hidden>{{player-play}}</span><span id="pauseLabel">暂停此站点</span></button><label class="duration"><span class="srOnly">暂停时长</span><select id="duration" aria-label="暂停时长"><option value="10m">10 分钟</option><option value="1h">1 小时</option><option value="session">到关闭浏览器</option></select>{{chevron-down}}</label></div>
<p id="actionStatus" role="status" aria-live="polite" hidden></p>
<section id="check" class="check" aria-live="polite" hidden><p id="checkText"></p><div id="checkActions" class="checkActions"></div></section>
<section class="tools"><div class="tiles"><button id="zap" class="tile" type="button" disabled>{{click}}<span class="rowText"><strong>这次先隐藏</strong><span>刷新后恢复</span></span></button><button id="pick" class="tile" type="button" disabled>{{eye-off}}<span class="rowText"><strong>以后都隐藏</strong><span>可撤销</span></span></button></div>
<button id="unpick" class="toolRow" type="button" hidden>{{trash}}<span class="rowText"><strong>管理本站已隐藏的元素</strong><span>查看或删除已保存的规则</span></span>{{chevron-right}}</button>
<button id="stats" class="textButton" type="button" disabled>查看近期规则命中</button><p id="statsText" hidden></p><p id="permission" class="note" hidden></p></section>
<footer><a id="center" href="../welcome.html" target="_blank">{{adjustments-horizontal}}<span>控制中心</span></a><a id="feedback" href="../welcome.html#feedback" target="_blank">{{message}}<span>反馈问题</span></a></footer>
</main><template id="icon-active">{{shield-check}}</template><template id="icon-paused">{{shield-pause}}</template><template id="icon-off">{{shield-off}}</template><script src="i18n.js"></script><script src="popup.js" defer></script></body></html>
